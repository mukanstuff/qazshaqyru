<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c8a96a" />
  <title>Hello · шаблон-проверка</title>
  <link rel="preload" as="image" href="/templates-html/hello-world/hero.webp" />
  <style>
    /* Pipeline-only styling. Not a real template. */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: #2a1d10;
      background: #faf6ef;
      display: grid;
      place-items: center;
      padding: clamp(20px, 4vw, 40px);
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: #fff;
      border: 1px solid #e7d9b6;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 12px 36px rgba(40, 25, 8, 0.08);
    }
    .card__hero {
      aspect-ratio: 4 / 3;
      background: #efe2c6 url('/templates-html/hello-world/hero.webp') center/cover no-repeat;
    }
    .card__body { padding: clamp(20px, 5vw, 32px); text-align: center; }
    .card__eyebrow {
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #8a6a2c;
      margin: 0 0 12px;
    }
    .card__couple {
      font-size: clamp(1.8rem, 6vw, 2.4rem);
      margin: 0;
      font-weight: 600;
    }
    .card__date { margin-top: 14px; font-size: 1rem; color: #5a4630; }
    .card__i18n { margin-top: 18px; font-size: 0.85rem; color: #8a6a2c; }
    @media (prefers-reduced-motion: no-preference) {
      .card { animation: lift 0.6s ease both; }
      @keyframes lift { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    }
  </style>
</head>
<body>
  <main class="card" data-template="hello-world">
    <div class="card__hero" aria-hidden="true"></div>
    <div class="card__body">
      <p class="card__eyebrow" data-i18n-kk="Шақыру" data-i18n-ru="Приглашение"></p>
      <h1 class="card__couple" data-bind="couple"></h1>
      <p class="card__date">
        <span data-bind="eventDate"></span>
        ·
        <span data-bind="eventTime"></span>
      </p>
      <p class="card__date" data-bind="eventPlace"></p>
      <p class="card__i18n" data-i18n-kk="Бұл — pipeline-тест, шынайы шаблон емес." data-i18n-ru="Это pipeline-тест, не настоящий шаблон."></p>
    </div>
  </main>
</body>
</html>

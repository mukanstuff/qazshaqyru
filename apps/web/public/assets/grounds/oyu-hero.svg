<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 760" preserveAspectRatio="xMidYMid slice" width="390" height="760">
  <!--
    Ground for the Altyn Oyu hero.

    Authored as vector rather than generated as a raster on purpose: a dark
    field is mostly a gradient, and an 8-bit JPEG of a gradient bands visibly on
    a phone screen while this scales to any size for two kilobytes. The grain is
    real fractal noise, which is what stops a dark panel reading as flat plastic.
  -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="72%" r="72%">
      <stop offset="0%"   stop-color="#6d5320" stop-opacity="0.55"/>
      <stop offset="38%"  stop-color="#3a2e18" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#14171b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="78%">
      <stop offset="55%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="390" height="760" fill="#14171b"/>
  <rect width="390" height="760" fill="url(#glow)"/>
  <!-- Gold dust: the noise is tinted warm and kept faint enough to read as
       paper tooth rather than as television static. -->
  <rect width="390" height="760" filter="url(#grain)" opacity="0.14" style="mix-blend-mode:overlay"/>
  <rect width="390" height="760" fill="url(#vignette)"/>
</svg>

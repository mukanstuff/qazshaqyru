<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 500" preserveAspectRatio="xMidYMid slice" width="390" height="500">
  <!-- Mirror of the hero: the light pools at the foot of the page so the
       invitation closes on warmth instead of stopping on black. The viewBox
       matches the section height exactly — when it did not, `cover` cropped the
       glow into the middle of the screen. -->
  <defs>
    <radialGradient id="glowB" cx="50%" cy="98%" r="76%">
      <stop offset="0%"   stop-color="#7a5c22" stop-opacity="0.62"/>
      <stop offset="42%"  stop-color="#3a2e18" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#14171b" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain3" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="21" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="390" height="500" fill="#14171b"/>
  <rect width="390" height="500" fill="url(#glowB)"/>
  <rect width="390" height="500" filter="url(#grain3)" opacity="0.13" style="mix-blend-mode:overlay"/>
</svg>

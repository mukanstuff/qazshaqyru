<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 440" preserveAspectRatio="xMidYMid slice" width="300" height="440">
  <!--
    The empty photo slot.

    A template must not ship carrying a stock couple: those faces are the first
    thing a customer sees in the catalogue and the first thing they have to
    delete. This is a panel that looks deliberate while empty — the same paper
    as the page, a hairline, and the crest at low light — and disappears the
    moment a real photograph is uploaded.
  -->
  <defs>
    <radialGradient id="slotGlow" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#3a3320" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1d2127" stop-opacity="1"/>
    </radialGradient>
    <filter id="slotGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="300" height="440" fill="url(#slotGlow)"/>
  <rect width="300" height="440" filter="url(#slotGrain)" opacity="0.12" style="mix-blend-mode:overlay"/>
  <g fill="none" stroke="#6b5a2a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"
     transform="translate(150 250) scale(0.62)" opacity="0.7">
    <g transform="translate(10 0) scale(1.5)">
      <path d="M0 0 C 26 0 40 -13 40 -30 C 40 -45 30 -54 18 -54 C 8 -54 2 -47 2 -39 C 2 -32 8 -28 13 -29 C 18 -30 20 -35 17 -38"/>
    </g>
    <g transform="scale(-1 1)"><g transform="translate(10 0) scale(1.5)">
      <path d="M0 0 C 26 0 40 -13 40 -30 C 40 -45 30 -54 18 -54 C 8 -54 2 -47 2 -39 C 2 -32 8 -28 13 -29 C 18 -30 20 -35 17 -38"/>
    </g></g>
  </g>
</svg>

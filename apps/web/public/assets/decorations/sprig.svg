<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 260" width="140" height="260" fill="none" stroke="#000" stroke-width="1.05" stroke-linecap="round">
  <!-- Main stem, drawn as one long sweep so the sprig reads as grown, not assembled. -->
  <path d="M18 256 C34 208 46 162 52 118 C57 80 62 48 74 16" />

  <!-- Leaves alternating along the stem. Each is a closed teardrop so the mask
       fills it solid, giving the sprig weight against the thin arch lines. -->
  <path d="M50 128 C34 120 22 128 16 142 C32 150 46 142 50 128 Z" fill="#000" stroke="none" opacity="0.9" />
  <path d="M55 100 C71 92 85 98 92 112 C76 122 60 114 55 100 Z" fill="#000" stroke="none" opacity="0.9" />
  <path d="M60 74 C46 64 32 70 26 84 C42 94 56 88 60 74 Z" fill="#000" stroke="none" opacity="0.85" />
  <path d="M66 48 C80 38 94 44 100 58 C84 68 70 62 66 48 Z" fill="#000" stroke="none" opacity="0.85" />
  <path d="M40 174 C26 166 14 174 9 188 C24 196 36 188 40 174 Z" fill="#000" stroke="none" opacity="0.8" />
  <path d="M45 202 C59 194 73 200 79 214 C63 224 49 216 45 202 Z" fill="#000" stroke="none" opacity="0.7" />

  <!-- Small buds at the tip. -->
  <circle cx="74" cy="16" r="3.4" fill="#000" stroke="none" />
  <circle cx="84" cy="26" r="2.4" fill="#000" stroke="none" opacity="0.8" />
  <circle cx="64" cy="28" r="2" fill="#000" stroke="none" opacity="0.7" />
</svg>

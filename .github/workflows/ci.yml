name: CI

on:
  push:
    branches: [main, master]
  pull_request:

defaults:
  run:
    working-directory: apps/web

jobs:
  migration-integrity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: invitation_user
          POSTGRES_PASSWORD: invitation_pass
          POSTGRES_DB: invitation_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invitation_user -d invitation_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Run migration integrity check
        run: pnpm db:generate && pnpm db:migrate:deploy && pnpm prisma migrate status
        env:
          DATABASE_URL: postgresql://invitation_user:invitation_pass@localhost:5432/invitation_db

  test:
    runs-on: ubuntu-latest
    needs: migration-integrity
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          SESSION_SECRET: ci-session-secret-minimum-32-characters-long
          APP_URL: http://localhost:3000

  e2e:
    runs-on: ubuntu-latest
    needs: [migration-integrity, test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: invitation_user
          POSTGRES_PASSWORD: invitation_pass
          POSTGRES_DB: invitation_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invitation_user -d invitation_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Prepare database
        run: pnpm db:generate && pnpm db:migrate:deploy && pnpm db:seed
        env:
          DATABASE_URL: postgresql://invitation_user:invitation_pass@localhost:5432/invitation_db

      - name: Build app
        run: pnpm build
        env:
          DATABASE_URL: postgresql://invitation_user:invitation_pass@localhost:5432/invitation_db
          SESSION_SECRET: ci-session-secret-minimum-32-characters-long
          APP_URL: http://127.0.0.1:3000

      - name: E2E tests
        run: pnpm test:e2e
        env:
          CI: 'true'
          NODE_ENV: development
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_PORT: '3000'
          DATABASE_URL: postgresql://invitation_user:invitation_pass@localhost:5432/invitation_db
          SESSION_SECRET: ci-session-secret-minimum-32-characters-long
          APP_URL: http://127.0.0.1:3000
          SMS_PROVIDER: mock
          PAYMENT_PROVIDER: mock
          ALLOW_MOCK_PAYMENT: 'true'
          ALLOW_DEV_OTP_CODE: 'true'

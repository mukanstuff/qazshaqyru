    <!-- Analytics (GA4 + Google Ads + Meta Pixel) load LAZILY — after the first
         user interaction or a short idle delay — so their scripts stay off the
         main thread during initial render (mobile TBT). Lightweight stubs are
         installed synchronously so the app can queue events immediately; the
         queue flushes once the vendor scripts arrive, so no events are lost. -->
    <script>
        (function () {
            // gtag stub — queues into dataLayer until gtag.js loads.
            window.dataLayer = window.dataLayer || [];
            function gtag() { dataLayer.push(arguments); }
            window.gtag = gtag;
            gtag('js', new Date());
            gtag('config', 'G-XR69MTD37Z');
            gtag('config', 'AW-18086421174');

            // Meta Pixel stub — queues into fbq.queue until fbevents.js loads.
            var metaPixelId = '1816249702688755';
            if (metaPixelId && typeof window.fbq !== 'function') {
                var n = window.fbq = function () {
                    n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
                };
                if (!window._fbq) window._fbq = n;
                n.push = n;
                n.loaded = true;
                n.version = '2.0';
                n.queue = [];
                window.fbq('init', metaPixelId);
                window.fbq('track', 'PageView');
            }

            var events = ['pointerdown', 'keydown', 'scroll', 'touchstart'];
            var loaded = false;
            function loadVendors() {
                if (loaded) return;
                loaded = true;
                events.forEach(function (ev) { window.removeEventListener(ev, loadVendors); });

                var g = document.createElement('script');
                g.async = true;
                g.src = 'https://www.googletagmanager.com/gtag/js?id=G-XR69MTD37Z';
                document.head.appendChild(g);

                if (metaPixelId) {
                    var f = document.createElement('script');
                    f.async = true;
                    f.src = 'https://connect.facebook.net/en_US/fbevents.js';
                    document.head.appendChild(f);
                }
            }

            events.forEach(function (ev) {
                window.addEventListener(ev, loadVendors, { passive: true });
            });
            // Any real engagement (tap/scroll/key) loads analytics immediately via
            // the listeners above. For zero-interaction sessions we still load as a
            // fallback, but only after ~9s + the next idle slot — that keeps GTM
            // (~146 KB) and the Meta Pixel (~133 KB) out of the LCP/TBT window on
            // mobile. Queued PageView events flush once the vendor scripts arrive.
            window.setTimeout(function () {
                if ('requestIdleCallback' in window) {
                    requestIdleCallback(loadVendors, { timeout: 3000 });
                } else {
                    loadVendors();
                }
            }, 9000);
        })();
    </script>
